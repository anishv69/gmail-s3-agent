
name: Gmail Auto Sync

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gmail-auto-sync
  cancel-in-progress: false

jobs:
  sync-gmail:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Trigger Vercel Gmail Sync
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET is missing"
            exit 1
          fi

          curl --fail-with-body \
            --silent --show-error \
            --retry 2 \
            --retry-delay 5 \
            --max-time 240 \
            --request POST \
            --header "Authorization: Bearer $CRON_SECRET" \
            --header "Content-Type: application/json" \
            "https://gmail-s3-agent.vercel.app/api/cron/poll"
