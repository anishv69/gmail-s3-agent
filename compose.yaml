services:
  postgres:
    image: postgres:16-alpine
    container_name: gmail-s3-agent-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in the project .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the project .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in the project .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - gmail_s3_agent_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  gmail_s3_agent_postgres:
